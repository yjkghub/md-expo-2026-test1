    /* FORM CARD & RECORDED BADGE */

<body>

  <!-- PASSWORD PROTECTION OVERLAY -->
  <div id="auth-overlay">
    <div class="auth-box">

      <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Please enter the password to access.</p>

      <button onclick="checkPassword()">Access Portal</button>
      <div id="auth-error" class="auth-error">Incorrect password. Please try again.</div>
    </div>
  </div>

  <!-- TOP BRANDING HEADER (SCREEN) -->
  <div class="top-brand-header no-print">
    <div class="brand-text-area">
      <div class="brand-korean">백투에덴 건강 동우회</div>
      <div class="brand-english">BACK-TO-EDEN WELLNESS CLUB</div>
      <div class="brand-sub">b2e.wsk.church | b2ewellness@gmail.com</div>
    </div>
    <img src="WSK B2E Club_Banner_R2t.png" alt="Logo" class="brand-logo-img" onerror="this.style.display='none'">
  </div>

  <h2 class="main-heading">MD Expo 2026 Health Data Entry Form (TEST)</h2>

  <!-- CONTROL PANEL -->
  <div class="header-controls no-print">
    <label class="control-label">Search or Select Visitor</label>
    <input type="text" id="visitor-search" class="search-input-box" placeholder="🔍 Type SN or Name to search..." oninput="filterVisitorDropdown()">
    
    <select id="visitor-select" onchange="handleVisitorChange()">
      <option value="">-- Select Existing Number or Add New Number --</option>
      <option value="new">+ Add New Visitor</option>
    </select>

    <!-- INBODY OCR UPLOAD BUTTON -->
    <input type="file" id="inbody-file-input" accept="image/*" style="display:none" onchange="processInBodyImage(event)">
    <button class="btn-action btn-ocr" onclick="document.getElementById('inbody-file-input').click()">📷 Upload InBody Screenshot (Auto-Fill)</button>
    
    <div class="button-container">
      <button class="btn-action btn-save" id="save-btn" onclick="saveData()">Save / Update Measurements</button>
      <button class="btn-action btn-drive" id="drive-btn" onclick="saveToDrivePrompt()">📁 Save Result (Google)</button>
      <button class="btn-action btn-print" onclick="triggerPrint()">🖨️ Print Result</button>
    </div>

    <!-- STATUS DISPLAY BOX -->
    <div id="status" class="no-print">System Status: Ready. Upload screenshot to extract data...</div>
  </div>

  <!-- METRICS CONTAINER -->
  <div id="metrics-container"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby-oTR693t5Y36logsSb0Yau3nPmPWmWO9KyHyFkZCRVANESwVKi8A5XuhrJ5HctdOS/exec"; 
    let formStructure = [];
    let allVisitors = [];

    function checkPassword() {
      const pwd = document.getElementById("password-input").value;
      if (pwd === "Expo2026") {
        document.getElementById("auth-overlay").style.display = "none";
        initApp();
      } else {
        document.getElementById("auth-error").style.display = "block";
      }
    }

    // BULLETPROOF ISOLATED PARSER
    async function processInBodyImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      showStatus("⏳ OCR Active: Scanning image...", "loading");

      try {
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        
        showStatus("=== RAW OCR TEXT ===\n" + text, "success");

        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        function getVal(keywordList) {
          for (let i = 0; i < lines.length; i++) {
            let l = lines[i].toLowerCase();
            for (let kw of keywordList) {
              if (l.includes(kw)) {
                let m = lines[i].match(/(\d+\.\d+|\d+)/g);
                if (m) {
                  let filtered = m.filter(num => num !== kw && parseFloat(num) < 1000);
                  if (filtered.length > 0) return filtered[filtered.length - 1];
                }
                if (i > 0) {
                  let pm = lines[i - 1].match(/(\d+\.\d+|\d+)/g);
                  if (pm) return pm[pm.length - 1];
                }
              }
            }
          }
          return "";
        }

        const mapping = {
          6: getVal(['weight']),
          7: getVal(['bmi']),
          8: getVal(['body fat', 'fat (%)', 'fat']),
          9: getVal(['fat-free', 'fat free', 'ffw']),
          10: getVal(['subcutaneous']),
          11: getVal(['visceral']),
          12: getVal(['body water', 'water']),
          13: getVal(['skeletal muscle']),
          14: getVal(['muscle mass']),
          15: getVal(['muscle percentage', 'muscle %']),
          16: getVal(['bone mass']),
          17: getVal(['bone percent', 'bone %']),
          18: getVal(['protein']),
          19: getVal(['bmr', 'kcal']),
          20: getVal(['metabolic age', 'metabolic'])
        };

        for (let rowIndex in mapping) {
          let val = mapping[rowIndex];
          if (val) {
            const input = document.getElementById("row_" + rowIndex);
            if (input) {
              input.value = val;
              input.dispatchEvent(new Event('input'));
            }
          }
        }

      } catch (err) {
        showStatus("OCR Error: " + err.message, "error");
      }

      event.target.value = ""; 
    }

    function triggerPrint() {
      document.querySelectorAll("#metrics-container input").forEach(input => {
        input.setAttribute('value', input.value);
      });

      const visitorSelect = document.getElementById("visitor-select");
      const selectedOptionText = visitorSelect.options[visitorSelect.selectedIndex] ? visitorSelect.options[visitorSelect.selectedIndex].text : "Visitor";
      
      let visitorSerial = "000";
      const snInput = document.getElementById("row_2");
      if (snInput && snInput.value.trim() !== "") {
        let rawSn = snInput.value.trim().replace(/^SN\s*/i, "");
        if (!isNaN(rawSn) && rawSn !== "") {
          visitorSerial = String(rawSn).padStart(3, '0');
        }
      } else if (visitorSelect.value && visitorSelect.value !== "new") {
        visitorSerial = String(visitorSelect.value).padStart(3, '0');
      }
      
      const cleanVisitorName = selectedOptionText.split('-')[0].trim().replace(/[^a-zA-Z0-9가-힣]/g, "_");
      const rawFilename = `${visitorSerial}_${cleanVisitorName}_MD_Expo_2026_Health_Report.pdf`;
      const pdfFilename = rawFilename.replace(/_+/g, "_");

      const logoImg = document.querySelector('.brand-logo-img');
      let logoHtmlTag = '';
      if (logoImg && logoImg.complete && logoImg.naturalWidth !== 0) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = logoImg.naturalWidth;
          canvas.height = logoImg.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(logoImg, 0, 0);
          logoHtmlTag = `<img src="${canvas.toDataURL('image/png')}" style="max-height: 40px; max-width: 100px; width: auto; height: auto; object-fit: contain; justify-self: end;">`;
        } catch (e) {}
      }

      const printWindow = window.open('', '_blank');
      if (!printWindow) {
        alert("Popup blocked! Please allow popups for this site to print.");
        return;
      }

      printWindow.document.open();
      printWindow.document.write(`

        <html>
        <head>

          <title>${pdfFilename}</title>
          <style>

            @page { size: letter portrait; margin: 4mm; }
            .print-header { display: grid !important; grid-template-columns: 1fr auto !important; align-items: center !important; border-bottom: 2px solid #1a5276; padding-bottom: 5px; margin-bottom: 6px; width: 100%; box-sizing: border-box; }
            .brand-text-area { text-align: center; width: 100%; }
            .print-main-title { font-size: 16pt; font-weight: bold; color: #1a5276; line-height: 1.0; }
            .print-sub-line { font-size: 9.5pt; color: #333; margin-top: 1px; line-height: 1.0; }
            .print-club-line { font-size: 9.5pt; font-weight: bold; color: #1a5276; margin-top: 1px; line-height: 1.0; }
            .print-email-line { font-size: 9pt; color: #555; margin-top: 1px; line-height: 1.0; }
            #metrics-container { display: flex; flex-direction: column; gap: 2px; margin
